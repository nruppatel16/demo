[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algotrader"
version = "0.1.0"
description = "Paper-trading algorithmic trading + backtesting harness (educational; paper money only)"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43,<0.44",
    "pydantic-settings>=2.0,<3",
    "pandas>=2.0",
    "duckdb>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["algotrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
